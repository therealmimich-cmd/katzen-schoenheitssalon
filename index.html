<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Katzen-Schönheitssalon 🐱</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#120e19;overflow:hidden;
    font-family:"Trebuchet MS",Verdana,sans-serif;user-select:none;-webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  canvas{display:block;touch-action:none;background:#2a2233;border-radius:12px;
    box-shadow:0 12px 44px rgba(0,0,0,.65);cursor:pointer;}
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="960" height="640"></canvas></div>
<script>
(function(){
'use strict';

/* ============================================================
   KATZEN-SCHÖNHEITSSALON
   Ein 2D-Browserspiel: Wasche, kämme, füttere die Katze und
   schneide ihr die Krallen – in Badezimmer, Schlafzimmer, Wohnzimmer.
   ============================================================ */

var canvas = document.getElementById('game');
var ctx = canvas.getContext('2d');
var W = 960, H = 640;
var TAU = Math.PI * 2;

function resize(){
  var s = Math.min((window.innerWidth - 12) / W, (window.innerHeight - 12) / H);
  canvas.style.width  = Math.floor(W * s) + 'px';
  canvas.style.height = Math.floor(H * s) + 'px';
}
window.addEventListener('resize', resize);
resize();

/* ---------------- kleine Helfer ---------------- */
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
function rgb(c){ return 'rgb('+Math.round(c[0])+','+Math.round(c[1])+','+Math.round(c[2])+')'; }
function mixArr(a,b,t){ return [lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)]; }
function rgbLerp(a,b,t){ return rgb(mixArr(a,b,t)); }
function rr(x,y,w,h,r){
  r = Math.min(r, Math.abs(w)/2, Math.abs(h)/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function circ(x,y,r){ ctx.beginPath(); ctx.arc(x,y,r,0,TAU); }
function ell(x,y,rx,ry,rot){ ctx.beginPath(); ctx.ellipse(x,y,rx,ry,rot||0,0,TAU); }
function txt(s,x,y,size,color,align,bold){
  ctx.font = (bold?'bold ':'')+size+'px "Trebuchet MS",Verdana,sans-serif';
  ctx.fillStyle = color; ctx.textAlign = align||'left'; ctx.textBaseline = 'middle';
  ctx.fillText(s,x,y);
}
function shadow(x,y,r,a){
  ctx.save(); ctx.scale(1,0.3);
  circ(x, y/0.3, r);
  ctx.fillStyle = 'rgba(0,0,0,'+a+')'; ctx.fill();
  ctx.restore();
}

/* ---------------- Sound (winzig, per WebAudio) ---------------- */
var actx=null, muted=false;
function ensureAudio(){
  if(actx) return;
  try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ actx=null; }
}
function tone(freq,dur,type,vol,slideTo){
  if(muted) return;
  var a = actx; if(!a) return;
  try{
    var o=a.createOscillator(), g=a.createGain();
    o.type = type||'sine';
    o.frequency.setValueAtTime(freq, a.currentTime);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, a.currentTime+dur);
    g.gain.setValueAtTime(0.0001, a.currentTime);
    g.gain.exponentialRampToValueAtTime(vol||0.07, a.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime+dur);
    o.connect(g); g.connect(a.destination);
    o.start(); o.stop(a.currentTime+dur+0.03);
  }catch(e){}
}
function sfxMeow(){ tone(640,0.16,'sawtooth',0.045,880); setTimeout(function(){ tone(900,0.22,'sawtooth',0.04,560); },150); }
function sfxPop(){ tone(560,0.09,'triangle',0.05,900); }
function sfxClean(){ tone(1200,0.08,'square',0.03,1700); }
function sfxWin(){ [523,659,784,1047].forEach(function(f,i){ setTimeout(function(){ tone(f,0.32,'sine',0.06); }, i*140); }); }

/* ---------------- Spielzustand ---------------- */
var game = {
  wash:0, brush:0, feed:0, claw:0,     // Fortschritt 0..1
  teeth:0, play:0, nap:0,              // drei weitere Pflege-Aufgaben
  fed:false, sleeping:false,
  won:false, wonAt:0, winAck:false,
  startTime:0,
  hearts:0, petCount:0,
  particles:[]
};

var roomId = 'bathroom';
var roomOrder = ['bathroom','living','bedroom'];
var sleeping = false;

var cat = { x:680, y:550, tx:680, ty:550, scale:0.8, tail:0, walkT:0,
            grabbed:false, inTub:false, blink:0, blinkTimer:2 };

var ITEM_DEFS = {
  soap:    { kind:'soap',    room:'bathroom', x:185, y:522, label:'Duschgel',   icon:'🧴' },
  comb:    { kind:'comb',    room:'bathroom', x:95,  y:528, label:'Kamm',       icon:'🪮' },
  scissor: { kind:'scissor', room:'bathroom', x:278, y:522, label:'Schere',     icon:'✂️' },
  brush2:  { kind:'brush2',  room:'bathroom', x:372, y:524, label:'Zahnbürste', icon:'🪥' },
  ball:    { kind:'ball',    room:'living',   x:742, y:524, label:'Spielball',  icon:'🧶' },
  food:    { kind:'food',    room:'living',   x:862, y:520, label:'Futter',     icon:'🍗' },
  pillow:  { kind:'pillow',  room:'bedroom',  x:790, y:518, label:'Kissen',     icon:'💤' }
};
var items = {};
for(var key in ITEM_DEFS){
  items[key] = Object.assign({}, ITEM_DEFS[key]);
  items[key].homeX = ITEM_DEFS[key].x;
  items[key].homeY = ITEM_DEFS[key].y;
  items[key].carried = false;
}

var CAT_SPOTS = {
  bathroom:{ x:680, y:550 },
  living:  { x:660, y:545 },
  bedroom: { x:700, y:545 }
};
var ROOM_NAMES = { bathroom:'Badezimmer', living:'Wohnzimmer', bedroom:'Schlafzimmer' };

var TASKS = [
  { id:'wash',  icon:'🛁', label:'Waschen',    short:'Waschen' },
  { id:'brush', icon:'🪮', label:'Kämmen',     short:'Kämmen' },
  { id:'claw',  icon:'✂️', label:'Krallen',    short:'Krallen' },
  { id:'teeth', icon:'🪥', label:'Zähne',      short:'Zähne' },
  { id:'feed',  icon:'🍗', label:'Füttern',    short:'Füttern' },
  { id:'play',  icon:'🧶', label:'Spielen',    short:'Spielen' },
  { id:'nap',   icon:'💤', label:'Schlafen',   short:'Schlafen' }
];
function prog(id){ return game[id]; }

var drag = null;
var selectedKind = null;
var uiButtons = [];

var msg = '', msgTimer = 0;
function say(t, dur){ msg = t; msgTimer = dur || 2.6; }

var showTutorial = true;
var showWin = false;

/* ---------------- Raum wechseln ---------------- */
function enterRoom(id){
  roomId = id;
  cat.inTub = false;
  cat.tx = CAT_SPOTS[id].x; cat.ty = CAT_SPOTS[id].y;
  cat.x = cat.tx; cat.y = cat.ty;      /* beim Raumwechsel sofort an den Platz setzen */
  cat.grabbed = false;
  for(var k in items){
    if(items[k].room === id){ items[k].x = items[k].homeX; items[k].y = items[k].homeY; }
    items[k].carried = false;
  }
  selectedKind = null;
  drag = null;
  if(sleeping){ sleeping = false; }
  tone(400,0.08,'sine',0.04,600);
}

/* ---------------- Fortschritt ---------------- */
function complete(text){
  burst(cat.x, cat.y-90, 'star', 22);
  say(text, 3.0);
  tone(880,0.18,'sine',0.06,1200);
}
function allDone(){
  return game.wash>=1 && game.brush>=1 && game.feed>=1 && game.claw>=1 &&
         game.teeth>=1 && game.play>=1 && game.nap>=1;
}
function doneCount(){
  var n = 0;
  for(var i=0;i<TASKS.length;i++){ if(game[TASKS[i].id] >= 1) n++; }
  return n;
}
function checkWin(){
  if(allDone() && !game.won){
    game.won = true;
    game.wonAt = now;
    game.winAck = false;
    sfxWin();
    burst(cat.x, cat.y-90, 'star', 40);
    burst(cat.x, cat.y-130, 'heart', 18);
    say('Fertig! Die Katze ist wunderschön und rundum gepflegt! 🐱✨', 4);
  }
}

/* Streicheln: gibt der Katze Herzen (Bonus, kein Pflichtschritt) */
function petCat(){
  game.petCount++;
  game.hearts = Math.min(999, game.hearts + 1);
  burst(cat.x, cat.y-120, 'heart', 4);
  sfxPop();
  var fluff = ['Schnurr... 🐾','Miau! 💕','Schnurrr...','Die Katze genießt das.'];
  say(fluff[game.petCount % fluff.length], 1.6);
  if(game.petCount === 10) say('10 Streicheleinheiten! Die Katze liebt dich. 💖', 2.6);
}

function applyTool(kind){
  /* Das Kissen ist die einzige Aktion, die NUR bei schlafender Katze wirkt */
  if(sleeping && kind !== 'pillow'){
    say('Die Katze schläft... wecke sie zuerst.',2.2); return;
  }

  if(kind === 'soap'){
    if(game.wash >= 1){ say('Die Katze ist schon blitzsauber! ✨',2.2); return; }
    if(!cat.inTub){ say('Setze die Katze zuerst in die Badewanne! 🛁',2.8); sfxPop(); return; }
    game.wash = Math.min(1, game.wash + 0.34);
    burst(cat.x, cat.y-60, 'bubble', 20);
    sfxClean();
    if(game.wash >= 1){ complete('Schrubb schrubb – die Katze ist blitzsauber! ✨'); }
    else { say('Schrubb schrubb... noch ein bisschen! 🫧',2.0); }
    checkWin();
  }
  else if(kind === 'comb'){
    if(game.brush >= 1){ say('Das Fell ist schon ganz weich und ordentlich! ✨',2.2); return; }
    game.brush = Math.min(1, game.brush + 0.34);
    burst(cat.x, cat.y-100, 'spark', 12);
    sfxClean();
    if(game.brush >= 1){ complete('Das Fell ist weich und glänzt! ✨'); }
    else { say('Bürste, bürste... nicht mehr zappeln!',2.0); }
    checkWin();
  }
  else if(kind === 'food'){
    if(game.feed >= 1){ say('Die Katze ist satt und zufrieden. 😋',2.2); return; }
    game.feed = Math.min(1, game.feed + 0.34);
    burst(cat.x+30, cat.y-20, 'crumb', 14);
    sfxPop();
    if(game.feed >= 1){
      game.fed = true;
      complete('Mjam mjam! Die Katze ist satt und schnurrt! 😋');
      tone(240,0.5,'sine',0.05,180);
    } else { say('Mjam mjam mjam! 🍗',2.0); }
    checkWin();
  }
  else if(kind === 'scissor'){
    if(game.claw >= 1){ say('Die Krallen sind schon kurz und sauber! ✨',2.2); return; }
    game.claw = Math.min(1, game.claw + 0.34);
    burst(cat.x-40, cat.y-10, 'spark', 12);
    tone(1500,0.06,'square',0.03,900);
    if(game.claw >= 1){ complete('Schnipp schnapp – die Krallen sind kurz! ✨'); }
    else { say('Schnipp... die Katze zieht die Pfote weg. 🙃',2.0); }
    checkWin();
  }
  else if(kind === 'brush2'){
    if(game.teeth >= 1){ say('Die Zähne blitzen schon! 🦷✨',2.2); return; }
    game.teeth = Math.min(1, game.teeth + 0.34);
    burst(cat.x+50, cat.y-115, 'bubble', 16);
    tone(900,0.07,'triangle',0.035,1300);
    if(game.teeth >= 1){ complete('Blitzblanke Zähne! Kein Katzen-Mundgeruch mehr. 🪥'); }
    else { say('Schrubbel schrubbel... Maul auf! 🦷',2.0); }
    checkWin();
  }
  else if(kind === 'ball'){
    if(game.play >= 1){ say('Die Katze ist schon müde vom Spielen. 😺',2.2); return; }
    game.play = Math.min(1, game.play + 0.34);
    burst(cat.x+70, cat.y-70, 'star', 14);
    tone(700,0.09,'square',0.04,1100);
    if(game.play >= 1){ complete('Miau! Die Katze hat getollt und ist glücklich! 🧶'); }
    else { say('Die Katze jagt dem Ball nach! 🧶',2.0); }
    checkWin();
  }
  else if(kind === 'pillow'){
    if(game.nap >= 1){ say('Die Katze ist ausgeschlafen und munter! 😸',2.2); return; }
    if(!sleeping){
      say('Lege die Katze zuerst ins Bett – dann deck sie zu. 💤',2.8);
      sfxPop(); return;
    }    game.nap = Math.min(1, game.nap + 0.34);
    burst(cat.x, cat.y-70, 'heart', 8);
    tone(420,0.22,'sine',0.04,300);
    if(game.nap >= 1){ complete('Gut zugedeckt – die Katze hat herrlich geschlafen! 💤'); }
    else { say('Deck die Katze schön zu... 💤',2.0); }
    checkWin();
  }
}

/* ---------------- Partikel ---------------- */
function burst(x,y,type,n){
  for(var i=0;i<n;i++){
    var a = Math.random()*TAU, sp = 40 + Math.random()*130;
    game.particles.push({
      x:x, y:y,
      vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 40,
      life:0, max:0.7 + Math.random()*0.8,
      type:type, size:4 + Math.random()*7,
      rot:Math.random()*TAU, vr:(Math.random()-0.5)*4
    });
  }
}
function updateParticles(dt){
  for(var i=game.particles.length-1;i>=0;i--){
    var p = game.particles[i];
    p.life += dt;
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.vy += (p.type==='bubble' ? -70 : 210)*dt;
    p.vx *= 0.99;
    p.rot += p.vr*dt;
    if(p.life >= p.max) game.particles.splice(i,1);
  }
}

/* ---------------- Katzen-Farben ---------------- */
function catPalette(){
  var clean = game.wash;                 // 0 = dreckig, 1 = sauber
  var base = mixArr([118,122,130],[242,182,104], clean);
  var dark = [base[0]*0.80, base[1]*0.78, base[2]*0.80];
  var light= [Math.min(255,base[0]*1.12+34), Math.min(255,base[1]*1.10+32), Math.min(255,base[2]*1.06+26)];
  return { base:rgb(base), dark:rgb(dark), light:rgb(light), raw:base };
}

/* ---------------- Katze zeichnen ---------------- */
function catHit(p){
  if(sleeping){ return Math.abs(p.x-cat.x)<115 && p.y>cat.y-105 && p.y<cat.y+45; }
  var s = cat.scale;
  return p.x>cat.x-100*s && p.x<cat.x+130*s && p.y>cat.y-180*s && p.y<cat.y+22*s;
}

function drawCat(t){
  if(sleeping){ drawCatSleeping(t); return; }
  var pal = catPalette();
  var dirty = 1-game.wash;
  var messy = 1-game.brush;
  var claw  = 1-game.claw;
  var mood  = game.fed ? (allDone()? 'happy' : 'content') : 'hungry';
  if(mood === 'hungry' && game.feed>0) mood = 'content';
  if(game.play >= 1) mood = 'happy';          /* nach dem Spielen ist sie besonders fröhlich */
  if(allDone()) mood = 'happy';
  if(cat.grabbed) mood = 'shock';

  ctx.save();
  ctx.translate(cat.x, cat.y);
  shadow(0, 4, 66*cat.scale, 0.20);
  ctx.scale(cat.scale, cat.scale);

  /* Schwanz */
  var tw = Math.sin(cat.tail)*0.7 + (cat.grabbed?0.5:0);
  ctx.strokeStyle = pal.dark; ctx.lineWidth = 15; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(52,-70);
  ctx.bezierCurveTo(104,-72, 112+tw*14,-120, 88+tw*20,-152);
  ctx.stroke();
  ctx.strokeStyle = pal.light; ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(96+tw*16,-146);
  ctx.lineTo(88+tw*20,-152);
  ctx.stroke();

  /* Hinterbeine */
  ctx.fillStyle = pal.dark;
  rr(18,-36,19,36,9); ctx.fill();
  rr(50,-36,19,36,9); ctx.fill();
  ctx.fillStyle = pal.light;
  ell(27.5,-4,13,8); ctx.fill();
  ell(59.5,-4,13,8); ctx.fill();

  /* Körper */
  ctx.fillStyle = pal.base;
  ell(0,-62,72,46); ctx.fill();
  /* Rücken-Abdunklung */
  ctx.fillStyle = 'rgba(0,0,0,0.07)';
  ell(6,-50,66,34); ctx.fill();

  /* Streifen */
  ctx.strokeStyle = pal.dark; ctx.lineWidth = 6; ctx.lineCap = 'round';
  for(var i=0;i<4;i++){
    var sx = -46 + i*30;
    ctx.beginPath();
    ctx.moveTo(sx, -96 + Math.abs(i-1.5)*3);
    ctx.quadraticCurveTo(sx+6, -78, sx+2, -62);
    ctx.stroke();
  }

  /* Vorderbeine */
  ctx.fillStyle = pal.base;
  rr(-54,-38,19,38,9); ctx.fill();
  rr(-26,-38,19,38,9); ctx.fill();
  ctx.strokeStyle = pal.dark; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-44,-30); ctx.lineTo(-44,-8); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-16,-30); ctx.lineTo(-16,-8); ctx.stroke();
  ctx.fillStyle = pal.light;
  ell(-44.5,-4,13,8); ctx.fill();
  ell(-16.5,-4,13,8); ctx.fill();

  /* Bauch */
  ctx.fillStyle = pal.light;
  ell(-16,-40,34,24); ctx.fill();

  /* Kopf */
  var hx = 74, hy = -110, hr = 37;
  /* Ohren */
  ctx.fillStyle = pal.base;
  ctx.beginPath(); ctx.moveTo(hx-26,hy-24); ctx.lineTo(hx-14,hy-58); ctx.lineTo(hx+4,hy-30); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(hx+10,hy-30); ctx.lineTo(hx+28,hy-56); ctx.lineTo(hx+34,hy-22); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(240,150,170,0.85)';
  ctx.beginPath(); ctx.moveTo(hx-19,hy-27); ctx.lineTo(hx-14,hy-48); ctx.lineTo(hx-3,hy-30); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(hx+16,hy-29); ctx.lineTo(hx+26,hy-47); ctx.lineTo(hx+29,hy-25); ctx.closePath(); ctx.fill();

  /* Kopfkugel */
  ctx.fillStyle = pal.base;
  circ(hx,hy,hr); ctx.fill();
  ctx.fillStyle = pal.light;
  ell(hx-8,hy+14,24,17); ctx.fill();

  /* Kopfstreifen */
  ctx.strokeStyle = pal.dark; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(hx-6,hy-34); ctx.lineTo(hx-4,hy-22); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(hx+2,hy-36); ctx.lineTo(hx+4,hy-22); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(hx+10,hy-33); ctx.lineTo(hx+14,hy-21); ctx.stroke();

  /* Barthaare */
  ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 2;
  var wz = [[-1,-6],[0,0],[-1,6]];
  for(var w=0; w<3; w++){
    ctx.beginPath();
    ctx.moveTo(hx-20, hy+6+wz[w][1]);
    ctx.lineTo(hx-56, hy+2+wz[w][0]*6+wz[w][1]*1.4);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(hx+18, hy+6+wz[w][1]);
    ctx.lineTo(hx+54, hy+2+wz[w][0]*6+wz[w][1]*1.4);
    ctx.stroke();
  }

  /* Augen */
  var blinkNow = cat.blink > 0.5;
  function eye(ex,ey){
    if(blinkNow || mood==='happy'){
      ctx.strokeStyle = '#3a2b25'; ctx.lineWidth = 3.5; ctx.lineCap='round';
      ctx.beginPath(); ctx.arc(ex, ey+3, 8, Math.PI*1.15, Math.PI*1.85); ctx.stroke();
      return;
    }
    if(mood==='hungry'){
      ctx.fillStyle = '#fff';
      ell(ex,ey,9,6.5); ctx.fill();
      ctx.fillStyle = '#5a3f2f';
      circ(ex, ey+0.5, 4.2); ctx.fill();
      ctx.strokeStyle = '#5a3f2f'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(ex-9,ey-9); ctx.lineTo(ex-2,ey-6); ctx.stroke();
      return;
    }
    ctx.fillStyle = '#fff';
    circ(ex,ey,10); ctx.fill();
    ctx.fillStyle = '#5a3f2f';
    circ(ex+ (mood==='shock'?0:0), ey, mood==='shock'?8.5:6.5); ctx.fill();
    ctx.fillStyle = '#1d1410';
    circ(ex, ey, 3.0); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    circ(ex-3, ey-3.5, 2.6); ctx.fill();
  }
  eye(hx-14, hy-6);
  eye(hx+14, hy-6);

  /* Näschen + Mund */
  ctx.fillStyle = '#f28aa0';
  ctx.beginPath();
  ctx.moveTo(hx-5, hy+10); ctx.lineTo(hx+5, hy+10); ctx.lineTo(hx, hy+16);
  ctx.closePath(); ctx.fill();

  ctx.strokeStyle = '#4a342c'; ctx.lineWidth = 2.6; ctx.lineCap='round';
  if(mood==='happy'){
    ctx.beginPath(); ctx.arc(hx-6, hy+18, 7, 0, Math.PI); ctx.stroke();
    ctx.beginPath(); ctx.arc(hx+6, hy+18, 7, 0, Math.PI); ctx.stroke();
  } else if(mood==='hungry'){
    ctx.fillStyle = '#8a4a4a';
    ell(hx, hy+23, 8, 10); ctx.fill();
    ctx.fillStyle = '#f28aa0';
    ell(hx, hy+29, 5, 4); ctx.fill();
  } else {
    ctx.beginPath();
    ctx.moveTo(hx, hy+16);
    ctx.lineTo(hx, hy+20);
    ctx.moveTo(hx, hy+20);
    ctx.quadraticCurveTo(hx-6, hy+26, hx-10, hy+19);
    ctx.moveTo(hx, hy+20);
    ctx.quadraticCurveTo(hx+6, hy+26, hx+10, hy+19);
    ctx.stroke();
  }

  /* blitzblanke Zähne + Glitzer nach dem Zähneputzen (über dem Mund) */
  if(game.teeth >= 1){
    ctx.fillStyle = '#ffffff';
    rr(hx-6, hy+18, 12, 5, 2); ctx.fill();
    ctx.strokeStyle = 'rgba(200,225,245,0.95)'; ctx.lineWidth=1; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    starPath(hx+20, hy-2, 7, 2.8, 4); ctx.fill();
    starPath(hx+27, hy+7, 4.5, 1.8, 4); ctx.fill();
    starPath(hx+13, hy-13, 4, 1.6, 4); ctx.fill();
  }

  /* Krallen */
  if(claw > 0.2){
    ctx.fillStyle = '#fdf6e3';
    var clawLen = 9*claw;
    [[-44.5,-10],[-16.5,-10],[27.5,-10],[59.5,-10]].forEach(function(p){
      for(var c=-1;c<=1;c++){
        ctx.beginPath();
        ctx.moveTo(p[0]+c*7, p[1]);
        ctx.lineTo(p[0]+c*7+2.5, p[1]-clawLen);
        ctx.lineTo(p[0]+c*7+5, p[1]);
        ctx.closePath(); ctx.fill();
      }
    });
  }

  /* Schmutz-Flecken */
  if(dirty > 0.03){
    ctx.fillStyle = 'rgba(78,66,52,'+(0.5*dirty)+')';
    [[-42,-72,25],[-8,-42,30],[30,-74,23],[-62,-40,19],[22,-28,17],
     [hx-6,hy-4,18],[hx+22,hy+6,15],[52,-48,20],[-18,-96,20],[8,-64,14]].forEach(function(d){
      ell(d[0],d[1],d[2],d[2]*0.72, 0.3); ctx.fill();
    });
    /* Dreck-Fusseln */
    ctx.strokeStyle = 'rgba(70,58,44,'+(0.45*dirty)+')'; ctx.lineWidth = 3;
    for(var q=0;q<6;q++){
      var ang = q*1.05;
      ctx.beginPath();
      ctx.moveTo(Math.cos(ang)*40, -62+Math.sin(ang)*22);
      ctx.lineTo(Math.cos(ang)*52, -62+Math.sin(ang)*30);
      ctx.stroke();
    }
  }

  /* verwuscheltes Fell */
  if(messy > 0.15){
    ctx.fillStyle = pal.base;
    var n = Math.round(messy*12);
    for(var f=0; f<n; f++){
      var a2 = Math.PI*1.05 + (f/(n-1||1))*Math.PI*0.9;
      var bx = Math.cos(a2)*68, by = -62 + Math.sin(a2)*42;
      ctx.beginPath();
      ctx.moveTo(bx-7, by+6);
      ctx.lineTo(bx+Math.cos(a2)*14*(0.6+messy*0.6), by+Math.sin(a2)*14);
      ctx.lineTo(bx+7, by+8);
      ctx.closePath(); ctx.fill();
    }
    /* Kopfhaar */
    for(var f2=0; f2<4; f2++){
      var ax = hx-18+f2*12;
      ctx.beginPath();
      ctx.moveTo(ax, hy-30);
      ctx.lineTo(ax+4, hy-30-12*messy-6);
      ctx.lineTo(ax+10, hy-27);
      ctx.closePath(); ctx.fill();
    }
  }

  ctx.restore();

  /* Zzz beim Schlafen nicht hier */
  if(sleeping) return;
}

function drawCatSleeping(t){
  var pal = catPalette();
  var dirty = 1-game.wash;
  ctx.save();
  ctx.translate(cat.x, cat.y);
  shadow(0, 6, 78*cat.scale, 0.22);
  ctx.scale(cat.scale, cat.scale);

  /* eingerollter Schwanz */
  ctx.strokeStyle = pal.dark; ctx.lineWidth = 16; ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(48,-42);
  ctx.bezierCurveTo(86,-30, 60,6, 6,4);

  /* Körper (Laib) */
  ctx.fillStyle = pal.base;
  ell(-4,-46,86,48); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.07)';
  ell(0,-34,76,34); ctx.fill();
  ctx.fillStyle = pal.light;
  ell(-30,-30,40,24); ctx.fill();

  /* Kuscheldecke – wächst mit dem Zudecken-Fortschritt.
     Wird vor dem Kopf gezeichnet, damit dieser frei bleibt. */
  var cover = game.nap;
  if(cover > 0 || sleeping){
    var cov = Math.max(0.55, cover);
    var topY = -6 - cov*54;          /* Oberkante wandert je Fortschritt nach oben */
    ctx.save();
    ell(-4,-46,84,46); ctx.clip();   /* nur der Rumpf */
    var cg = ctx.createLinearGradient(0, topY, 0, 2);
    cg.addColorStop(0,'#aed4f7'); cg.addColorStop(1,'#6f9fd8');
    ctx.fillStyle = cg;
    ctx.fillRect(-92, topY, 184, 120);
    /* Stoff-Falten */
    ctx.strokeStyle = 'rgba(255,255,255,0.32)'; ctx.lineWidth = 3;
    for(var fq=0; fq<3; fq++){
      ctx.beginPath();
      ctx.moveTo(-30+fq*30, topY+4);
      ctx.quadraticCurveTo(-18+fq*30, topY+22, -30+fq*30, 4);
      ctx.stroke();
    }
    /* Borte am oberen Rand */
    ctx.strokeStyle = '#e3eefb'; ctx.lineWidth = 9;
    ctx.beginPath(); ctx.moveTo(-92, topY+3); ctx.lineTo(92, topY+3); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.95)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-92, topY+1); ctx.lineTo(92, topY+1); ctx.stroke();
    ctx.restore();
  }

  /* Kopf abgelegt */
  var hx = -70, hy = -66;
  ctx.fillStyle = pal.base;
  ctx.beginPath(); ctx.moveTo(hx-22,hy-20); ctx.lineTo(hx-14,hy-50); ctx.lineTo(hx+2,hy-26); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(hx+12,hy-26); ctx.lineTo(hx+26,hy-46); ctx.lineTo(hx+30,hy-20); ctx.closePath(); ctx.fill();
  circ(hx,hy,32); ctx.fill();
  ctx.fillStyle = pal.light;
  ell(hx-6,hy+12,20,14); ctx.fill();

  /* geschlossene Augen */
  ctx.strokeStyle = '#3a2b25'; ctx.lineWidth = 3.4; ctx.lineCap='round';
  ctx.beginPath(); ctx.arc(hx-11, hy+1, 7, Math.PI*1.1, Math.PI*1.9); ctx.stroke();
  ctx.beginPath(); ctx.arc(hx+13, hy+1, 7, Math.PI*1.1, Math.PI*1.9); ctx.stroke();
  /* Näschen */
  ctx.fillStyle = '#f28aa0';
  ctx.beginPath(); ctx.moveTo(hx-5,hy+12); ctx.lineTo(hx+5,hy+12); ctx.lineTo(hx,hy+17); ctx.closePath(); ctx.fill();

  if(dirty > 0.05){
    ctx.fillStyle = 'rgba(78,66,52,'+(0.45*dirty)+')';
    ell(20,-58,24,17,0.2); ctx.fill();
    ell(-30,-56,20,14,-0.2); ctx.fill();
    ell(60,-36,16,12); ctx.fill();
  }
  ctx.restore();

  /* Zzz */
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  for(var i=0;i<3;i++){
    var zt = (t*0.6 + i*0.33) % 1;
    var zx = cat.x + 46 + i*16 - zt*10;
    var zy = cat.y - 96 - i*24 - zt*26;
    ctx.globalAlpha = 1-zt;
    txt('z', zx, zy, 16+i*6, '#ffffff', 'center', true);
  }
  ctx.globalAlpha = 1;
}

/* ---------------- Partikel zeichnen ---------------- */
function drawParticles(){
  for(var i=0;i<game.particles.length;i++){
    var p = game.particles[i];
    var k = 1 - p.life/p.max;
    ctx.save();
    ctx.globalAlpha = clamp(k,0,1);
    ctx.translate(p.x,p.y);
    if(p.type==='bubble'){
      circ(0,0,p.size*0.8); ctx.strokeStyle='rgba(255,255,255,0.95)'; ctx.lineWidth=2.4; ctx.stroke();
      circ(-p.size*0.25,-p.size*0.25,p.size*0.3); ctx.fillStyle='rgba(255,255,255,0.9)'; ctx.fill();
    } else if(p.type==='star'){
      ctx.rotate(p.rot);
      starPath(0,0,p.size,p.size*0.45,5);
      ctx.fillStyle='#ffe066'; ctx.fill();
      ctx.strokeStyle='rgba(255,180,0,0.8)'; ctx.lineWidth=1.5; ctx.stroke();
    } else if(p.type==='heart'){
      ctx.rotate(Math.sin(p.rot)*0.3);
      heartPath(0,0,p.size);
      ctx.fillStyle='#ff7fa8'; ctx.fill();
    } else if(p.type==='crumb'){
      circ(0,0,p.size*0.5); ctx.fillStyle='#a9744a'; ctx.fill();
    } else {
      starPath(0,0,p.size*0.7,p.size*0.28,4);
      ctx.fillStyle='#ffffff'; ctx.fill();
    }
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}
function starPath(x,y,r1,r2,n){
  ctx.beginPath();
  for(var i=0;i<n*2;i++){
    var a = -Math.PI/2 + i*Math.PI/n;
    var rad = i%2? r2 : r1;
    var px = x+Math.cos(a)*rad, py = y+Math.sin(a)*rad;
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.closePath();
}
function heartPath(x,y,s){
  ctx.beginPath();
  ctx.moveTo(x, y+s*0.75);
  ctx.bezierCurveTo(x-s*1.5, y-s*0.4, x-s*0.5, y-s*1.35, x, y-s*0.45);
  ctx.bezierCurveTo(x+s*0.5, y-s*1.35, x+s*1.5, y-s*0.4, x, y+s*0.75);
  ctx.closePath();
}

function getHint(){
  if(showTutorial || showWin) return '';
  if(allDone()) return 'Fertig! Die Katze ist rundum gepflegt 🐱✨';
  if(roomId==='bathroom'){
    if(!cat.inTub && game.wash<1) return 'Ziehe die Katze in die Badewanne 🛁';
    if(cat.inTub && game.wash<1) return 'Duschgel auf die Katze ziehen 🧴';
    if(game.brush<1) return 'Fell kämmen 🪮';
    if(game.claw<1) return 'Krallen kürzen ✂️';
    if(game.teeth<1) return 'Zähne putzen 🪥';
    return 'Im Bad ist alles erledigt ✔';
  }
  if(roomId==='living'){
    if(game.feed<1) return 'Futter auf die Katze ziehen 🍗';
    if(game.play<1) return 'Mit dem Spielball toben 🧶';
    return 'Im Wohnzimmer ist alles erledigt ✔';
  }
  if(roomId==='bedroom'){
    if(!sleeping) return 'Katze aufs Bett legen 😴';
    if(game.nap<1) return 'Die schlafende Katze zudecken 💤';
    return 'Im Schlafzimmer ist alles erledigt ✔';
  }
  return '';
}

    ctx.strokeStyle = i<stars ? '#e0a800' : 'rgba(255,255,255,0.25)'; ctx.lineWidth=2; ctx.stroke();
  }
  txt('Zeit: '+Math.floor(secs/60)+':'+('0'+(secs%60)).slice(-2), W/2, y+312, 17, '#cbbde8', 'center');
  txt('💖 '+game.hearts+' Streicheleinheiten   ·   '+TASKS.length+' / '+TASKS.length+' Pflege-Schritte',
      W/2, y+338, 15, '#ffc7dd', 'center', true);

  var byy = y+366, bh = 50;
  button('restart', W/2-230, byy, 220, bh);
  rr(W/2-230, byy, 220, bh, 14); ctx.fillStyle='rgba(255,255,255,0.14)'; ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.3)'; ctx.lineWidth=2; ctx.stroke();
  txt('Weiter spielen', W/2-120, byy+bh/2+1, 19, '#fff', 'center', true);

  button('again', W/2+10, byy, 220, bh);
  rr(W/2+10, byy, 220, bh, 14); ctx.fillStyle='#ffd166'; ctx.fill();
  txt('Nochmal spielen', W/2+120, byy+bh/2+1, 19, '#3a2a12', 'center', true);
}

/* ---------------- Eingabe ---------------- */
function toGame(e){
  var r = canvas.getBoundingClientRect();
  return { x:(e.clientX-r.left)*(W/r.width), y:(e.clientY-r.top)*(H/r.height) };
}
function hit(b,p){ return p.x>=b.x && p.x<=b.x+b.w && p.y>=b.y && p.y<=b.y+b.h; }

function handleButton(id){
  if(id==='dismiss'){ showTutorial=false; game.startTime=now; tone(600,0.1,'sine',0.05,900); return; }
  if(id==='mute'){ muted=!muted; if(!muted) tone(700,0.08,'sine',0.05); return; }
  if(id==='restart'){ showWin=false; game.winAck=true; return; } /* Weiter spielen: nur Overlay schliessen */
  if(id==='again'){ showWin=false; resetGame(); return; } /* Nochmal spielen: neu starten */
  if(id.indexOf('room:')===0){ enterRoom(id.slice(5)); return; }
}

function resetGame(){
  game.wash=0; game.brush=0; game.feed=0; game.claw=0;
  game.teeth=0; game.play=0; game.nap=0;
  game.fed=false; game.won=false; game.wonAt=0; game.winAck=false;
  game.hearts=0; game.petCount=0;
  game.particles.length=0;
  game.startTime=now;
  sleeping=false;
  selectedKind=null;
  showWin=false;
  enterRoom('bathroom');
  say('Neue Runde! Viel Spaß beim Verwöhnen. 🐱', 2.6);
}

function onDown(e){
  e.preventDefault();
  ensureAudio();
  if(actx && actx.state==='suspended'){ try{ actx.resume(); }catch(err){} }
  var p = toGame(e);
  for(var i=uiButtons.length-1;i>=0;i--){
    if(hit(uiButtons[i],p)){ handleButton(uiButtons[i].id); return; }
  }
  if(showTutorial || showWin) return;

  /* Gegenstand? */
  for(var k in items){
    var it = items[k];
    if(it.room !== roomId || it.carried) continue;
    if(Math.abs(p.x-it.x) < 52 && Math.abs(p.y-it.y) < 46){
      drag = { type:'item', kind:k, offx:p.x-it.x, offy:p.y-it.y,
               startX:p.x, startY:p.y, moved:false };
      it.carried = true;
      return;
    }
  }

  /* Katze? */
  if(catHit(p)){
    if(selectedKind){
      var kk = selectedKind; selectedKind = null;
      applyTool(kk);
      return;
    }
    if(sleeping){
      sleeping = false;
      say('Mrrrow! Die Katze ist aufgewacht. 🐱', 2.4);
      sfxMeow();
      return;
    }
    drag = { type:'cat', offx:p.x-cat.x, offy:p.y-cat.y,
             startX:p.x, startY:p.y, moved:false, petted:false };
    cat.grabbed = true;
    sfxPop();
    return;
  }

  selectedKind = null;
}

function onMove(e){
  if(!drag) return;
  e.preventDefault();
  var p = toGame(e);
  if(drag.type==='item'){
    var it = items[drag.kind];
    it.x = p.x - drag.offx;
    it.y = p.y - drag.offy;
    if(Math.hypot(p.x-drag.startX, p.y-drag.startY) > 14) drag.moved = true;
  } else if(drag.type==='cat'){
    cat.x = p.x - drag.offx;
    cat.y = p.y - drag.offy;
    cat.tx = cat.x; cat.ty = cat.y;
    if(Math.hypot(cat.x-drag.startX+p.x-cat.x, cat.y-drag.startY+p.y-cat.y) > 14) drag.moved = true;
    if(Math.hypot(p.x-drag.startX, p.y-drag.startY) > 14) drag.moved = true;
  }
}

function inTubZone(x,y){ return roomId==='bathroom' && x>560 && x<900 && y>380 && y<545; }
function inBedZone(x,y){ return roomId==='bedroom' && x>118 && x<540 && y>330 && y<556; }

function onUp(e){
  if(!drag) return;
  if(drag.type==='item'){
    var it = items[drag.kind];
    it.carried = false;
    if(!drag.moved){
      selectedKind = (selectedKind === drag.kind) ? null : drag.kind;
      if(selectedKind) say('Super! Tippe jetzt auf die Katze. 👆', 2.4);
    } else {
      var d = Math.hypot(it.x-cat.x, it.y-(cat.y-60));
      var reach = (drag.kind === 'pillow') ? 260 : 175;
      if(d < reach){
        applyTool(drag.kind);
      } else if(sleeping){
        say('Die Katze schläft. Wecke sie zum Pflegen zuerst! 😴', 2.4);
      } else {
        say('Nicht getroffen – ziehe das Teil direkt auf die Katze.', 2.2);
      }
    }
    it.x = it.homeX; it.y = it.homeY;
  }
  else if(drag.type==='cat'){
    cat.grabbed = false;
    var moved = drag.moved;                 /* Bewegung wird in onMove erkannt */
    if(moved){
      if(inTubZone(cat.x, cat.y)){
        cat.inTub = true;
        cat.x = 720; cat.y = 472; cat.tx = 720; cat.ty = 472;
        say('Platsch! Die Katze sitzt in der Badewanne. Nun Duschgel benutzen! 🫧', 3.0);
        sfxPop();
      } else {
        cat.inTub = false;
        if(inBedZone(cat.x, cat.y)){
          cat.x = 300; cat.y = 470; cat.tx = 300; cat.ty = 470;
          sleeping = true;
          say('Die Katze schläft auf dem Bett. 😴 Jetzt mit dem Kissen zudecken!', 3.2);
          tone(320,0.5,'sine',0.05,180);
        }
      }
    } else {
      /* nur angetippt, nicht gezogen -> streicheln */
      petCat();
    }
  }
  drag = null;
}
function onCancel(){ if(drag){ if(drag.type==='item'){ var it=items[drag.kind]; it.carried=false; it.x=it.homeX; it.y=it.homeY; } cat.grabbed=false; } drag=null; }

canvas.addEventListener('pointerdown', onDown);
window.addEventListener('pointermove', onMove);
window.addEventListener('pointerup', onUp);
window.addEventListener('pointercancel', onCancel);
canvas.addEventListener('contextmenu', function(e){ e.preventDefault(); });

window.addEventListener('keydown', function(e){
  var k = e.key.toLowerCase();
  if(k==='escape'){ selectedKind=null; }
  if(k==='1') enterRoom('bathroom');
  if(k==='2') enterRoom('living');
  if(k==='3') enterRoom('bedroom');
  if(k==='r'){ resetGame(); }
  if(k==='m'){ muted=!muted; }
  if(k===' ' || k==='enter'){ if(showTutorial){ showTutorial=false; game.startTime=now; } }
});

/* ---------------- Hauptschleife ---------------- */
var now = 0, last = 0;

function update(dt){
  now += dt;
  if(msgTimer > 0) msgTimer -= dt;

  /* Katze weich bewegen */
  if(!cat.grabbed){
    cat.x += (cat.tx - cat.x) * Math.min(1, dt*9);
    cat.y += (cat.ty - cat.y) * Math.min(1, dt*9);
  }
  var moving = Math.hypot(cat.tx-cat.x, cat.ty-cat.y) > 1.5;
  cat.walkT += dt * (moving ? 7 : 2.5);
  cat.tail += dt * (game.fed ? 3.4 : 1.6);

  /* Blinzeln */
  cat.blinkTimer -= dt;
  if(cat.blinkTimer <= 0){ cat.blinkTimer = 2 + Math.random()*3; cat.blink = 0.6; }
  if(cat.blink > 0) cat.blink -= dt;

  updateParticles(dt);

  if(game.won && !showWin && !game.winAck && now - game.wonAt > 1.6) showWin = true;
}

function render(){
  uiButtons = [];
  var t = now;
  ctx.clearRect(0,0,W,H);

  drawRoom(t);
  drawCat(t);
  drawTubWaterOverlay();

  for(var k in items){
    var it = items[k];
    if(it.room !== roomId || it.carried) continue;
    var sel = (selectedKind === k);
    if(sel){
      ctx.save();
      ctx.globalAlpha = 0.5 + Math.sin(t*4)*0.25;
      circ(it.x, it.y+6, 42); ctx.strokeStyle='#ffd166'; ctx.lineWidth=4; ctx.stroke();
      ctx.restore();
    }
    drawItemAt(k, it.x, it.y, t);
    labelPill(it.label, it.x, it.y - 54);
  }

  if(drag && drag.type==='item'){
    var di = items[drag.kind];
    drawItemAt(drag.kind, di.x, di.y, t, true);
  }

  drawParticles();
  drawHud(t);
  if(showTutorial) drawTutorial();
  if(showWin) drawWin();
}

function loop(ts){
  var dt = last ? Math.min(0.05, (ts-last)/1000) : 0.016;
  last = ts;
  update(dt);
  render();
  requestAnimationFrame(loop);
}

game.startTime = 0;
now = 0;
requestAnimationFrame(loop);

})();
</script>
</body>
